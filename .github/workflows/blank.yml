
name: Modern Control - NDK Check

on:
  workflow_dispatch:

jobs:
  check-ndk:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;27.2.12479018'

      - name: Verify ARM64 compiler
        run: |
          echo "SDK root: $ANDROID_HOME"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" --version
