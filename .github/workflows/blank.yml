
name: Modern Control - Gamepad Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'ndk;27.2.12479018'

      - name: Download AML Plugin SDK
        run: |
          git clone --recurse-submodules \
            https://github.com/AndroidModLoader/aml-psdk.git sdk

      - name: Build ARM64 template
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" \
            NDK_PROJECT_PATH=sdk \
            APP_BUILD_SCRIPT=sdk/Android.mk \
            NDK_APPLICATION_MK=sdk/Application.mk \
            APP_ABI=arm64-v8a

      - name: Upload compiled library
        uses: actions/upload-artifact@v4
        with:
          name: AML-PSDK-ARM64-Test
          path: sdk/libs/arm64-v8a/*.so
          if-no-files-found: error
